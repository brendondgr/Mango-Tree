<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for the env(safe-area-inset-*)
         variables the compact shell pads with to be non-zero; without it
         the bottom navigation sits under the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Mango Tree</title>
    <script>
      (function () {
        var key = "mango-theme";
        var themes = [
          "dark",
          "default",
          "blue-light",
          "blue-dark",
          "fsu-light",
          "fsu-dark",
          "pulse-light",
          "pulse-dark",
        ];
        try {
          var stored = localStorage.getItem(key);
          if (stored && themes.indexOf(stored) !== -1) {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
