filesystem:
  media_viewer_artifacts:
    description: Local artifact store read/write scope
    allow:
      - "{artifacts_root}/**"
    deny:
      - "../**"
      - "**/.env"
      - "config/**"
  mailbox_config:
    description: Local mailbox account-settings and secret store read/write scope
    allow:
      - "{mailbox_root}/**"
    deny:
      - "../**"
      - "**/.env"
      - "config/**"
  calendar_data:
    description: Local calendar JSON store (calendar.json + schedules/*.json) read/write scope
    allow:
      - "{calendar_root}/**"
    deny:
      - "../**"
      - "**/.env"
      - "config/**"
  imdbspy_media:
    description: Local IMDbSpy media cache (poster/headshot WebP) read/write scope
    allow:
      - "{imdbspy_media_root}/**"
    deny:
      - "../**"
      - "**/.env"
      - "config/**"

network:
  web_research:
    description: Outbound HTTP for SearXNG discovery and page text extraction
    allow_schemes:
      - http
      - https
  exercise_strava:
    description: Outbound HTTPS to the Strava API for activity import
    allow_schemes:
      - https
    allow_hosts:
      - www.strava.com
      - api.strava.com
  mailbox_imap_smtp:
    description: Outbound IMAP/SMTP to the supported mail providers (on-prem Exchange host is org-specific)
    allow_schemes:
      - imaps
      - imap
      - smtps
      - smtp
    allow_hosts:
      - imap.gmail.com
      - smtp.gmail.com
      - outlook.office365.com
      - smtp.office365.com
      - imap.mail.yahoo.com
      - smtp.mail.yahoo.com
  mailbox_graph:
    description: Outbound HTTPS to Microsoft Graph for the M365 Graph path
    allow_schemes:
      - https
    allow_hosts:
      - graph.microsoft.com
  imdbspy_scrape:
    description: Outbound HTTP(S) to IMDb + its image CDN for title/cast metadata and posters
    allow_schemes:
      - http
      - https
    allow_hosts:
      - m.imdb.com
      - m.media-amazon.com
      - images-na.ssl-images-amazon.com
      - ia.media-imdb.com
  mailbox_oauth:
    description: OAuth portal + token/userinfo endpoints for Gmail and M365 sign-in and refresh
    allow_schemes:
      - https
    allow_hosts:
      - accounts.google.com
      - oauth2.googleapis.com
      - openidconnect.googleapis.com
      - login.microsoftonline.com
      - outlook.office.com

artifacts_root: data/artifacts
mailbox_root: data/mailbox
calendar_root: data/calendar
imdbspy_media_root: data/imdbspy/media
