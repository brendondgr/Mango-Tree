# Tool groups are the toggle granularity for the session tool set (see
# docs/tool-groups.md). A tool's group is its `app` value unless it sets `group`.
# `default_enabled` seeds a new session's enabled set (only `core` is on by
# default). `prompt` (module:ATTR) is the app-specific guidance block appended to
# the system prompt when the group is enabled. Optional `requires: <capability>`
# gates a group behind a session precondition (none set today).
# `description` is what the tool router reads when it decides, per message,
# which groups a turn needs (docs/tool-groups.md, D16); `keywords` back a
# last-resort match when the router's answer cannot be parsed.
tool_groups:
  core:
    label: Core
    default_enabled: true
    description: Saved files and artifacts, agent skills, the chat context, and web search. Always available.
  media_viewer:
    label: Media Viewer
    default_enabled: false
    description: The local artifact store — list, inspect, save and delete uploaded or generated files (images, video, PDF, text).
    keywords: [artifact, artifacts, file, files, upload, uploaded, image, images, photo, video, pdf, save as]
    prompt: utils.apps.media_viewer.agent.prompts:MEDIA_VIEWER_PROMPT
  mailbox:
    label: Mailbox
    default_enabled: false
    description: Email accounts — read folders and messages, move, mark, file, delete, send and reply.
    keywords: [email, e-mail, mail, inbox, folder, send, reply, unread, gmail, outlook]
    prompt: utils.apps.mailbox.agent.prompts:MAILBOX_TOOLS_PROMPT
  calendar:
    label: Calendar
    default_enabled: false
    description: The dated calendar — events on a day/week/range, free slots, upcoming events, adding and moving one-off events, mapping weekly schedules.
    keywords: [calendar, schedule, event, events, appointment, meeting, free slot, free time, upcoming, book, booking]
    prompt: utils.apps.calendar.agent.prompts:CALENDAR_TOOLS_PROMPT
  exercise:
    label: Exercise
    default_enabled: false
    description: The workout tracker — workout templates, weekly routines, equipment, logged sessions and history, Strava import.
    keywords: [workout, workouts, exercise, gym, run, ran, running, walk, lift, lifting, routine, equipment, strava, training, session, reps, sets]
    prompt: utils.apps.exercise.agent.prompts:EXERCISE_TOOLS_PROMPT
  projectmanager:
    label: Project Manager
    default_enabled: false
    description: Projects and goals — the project board, goal deadlines and what is overdue, creating projects and adding goals.
    keywords: [project, projects, goal, goals, deadline, deadlines, due, overdue, milestone, task board]
    prompt: utils.apps.projectmanager.agent.prompts:PROJECTMANAGER_TOOLS_PROMPT
  imdbspy:
    label: IMDbSpy
    default_enabled: false
    description: The movie and TV tracker — tracked titles and their seen/unseen status, adding titles from IMDb, ratings and reviews, season progress.
    keywords: [movie, movies, film, films, tv show, tv shows, shows, series, tv, episode, season, imdb, watch, watched, watchlist, rating, rate]
    prompt: utils.apps.imdbspy.agent.prompts:IMDBSPY_TOOLS_PROMPT
  recipes:
    label: Recipes
    default_enabled: false
    description: The recipe book and pantry — browse recipes, full recipe detail, what can be cooked from ingredients on hand, creating and editing recipes.
    keywords: [recipe, recipes, cook, cooking, ingredient, ingredients, pantry, meal, dinner, lunch, breakfast, dish, bake]
    prompt: utils.apps.recipes.agent.prompts:RECIPES_TOOLS_PROMPT
  timekeeper:
    label: Time Keeper
    default_enabled: false
    description: Five-minute time tracking — what was tracked on a day, minutes per day, the category taxonomy, painting or clearing a day's blocks.
    keywords: [track, tracked, tracking, time keeper, timekeeper, hours spent, time spent, log time, paint, painted]
    prompt: utils.apps.timekeeper.agent.prompts:TIMEKEEPER_TOOLS_PROMPT

tools:
  # --- core: base tools always available unless the core group is toggled off ---
  list_artifacts:
    app: core
    module: utils.agents.tools.registry
    function: list_artifacts
    description: List all files in the artifacts directory.
    parameters:
      type: object
      properties: {}
  read_artifact:
    app: core
    module: utils.agents.tools.registry
    function: read_artifact
    description: >-
      Read and examine the content of an artifact file. Supports text files
      (code, markdown, json, etc.), image files (png, jpg, gif, webp), and video
      files (mp4, webm, mov). For images and videos, the file is loaded and sent
      to the model for visual analysis. Cannot be used for audio, PDF, or archive
      files.
    parameters:
      type: object
      properties:
        artifact_id:
          type: string
          description: The unique ID or filename of the artifact.
      required: [artifact_id]
  inspect_skills:
    app: core
    module: utils.agents.tools.registry
    function: inspect_skills
    description: List all agent skills documents available in the system.
    parameters:
      type: object
      properties: {}
  read_skill:
    app: core
    module: utils.agents.tools.registry
    function: read_skill
    description: >-
      Read the content of a specific agent skill document. Always call
      inspect_skills first to get valid skill names.
    parameters:
      type: object
      properties:
        skill_name:
          type: string
          description: The name of the skill (e.g., 'artifacts').
      required: [skill_name]
  inspect_chat_context:
    app: core
    module: utils.agents.tools.registry
    function: inspect_chat_context
    description: Inspect the conversation history and context.
    parameters:
      type: object
      properties: {}
  request_tool_groups:
    app: core
    module: utils.agents.tools.selection_tool
    function: request_tool_groups
    description: >-
      Ask for one or more app tool groups to be added to this turn when the task
      needs an app whose tools are not currently listed (for example
      "exercise" or "calendar"). The group's tools become available on your
      next step. Give the group ids exactly as listed in the system prompt.
    parameters:
      type: object
      properties:
        groups:
          type: array
          items:
            type: string
          description: Tool group ids to add, e.g. ["exercise", "imdbspy"].
        reason:
          type: string
          description: One sentence on why the task needs them.
      required: [groups]
  search_web:
    app: core
    module: utils.agents.tools.web_search
    function: search_web
    description: >-
      Search the web for external factual information via local SearXNG. Use when
      the question needs current events, documentation, statistics, or other facts
      not available in chat context.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: Concise web search query.
      required: [query]
  # --- app tool groups (default-off; toggled per session) ----------------------
  media_viewer_list_artifacts:
    app: media_viewer
    module: utils.apps.media_viewer.agent.tools
    function: list_artifacts
    description: List persisted artifacts, optionally filtered by kind.
  media_viewer_get_artifact:
    app: media_viewer
    module: utils.apps.media_viewer.agent.tools
    function: get_artifact
    description: Fetch artifact metadata by ID.
  media_viewer_save_artifact:
    app: media_viewer
    module: utils.apps.media_viewer.agent.tools
    function: save_artifact
    description: Save base64-encoded bytes as a local artifact.
  media_viewer_delete_artifact:
    app: media_viewer
    module: utils.apps.media_viewer.agent.tools
    function: delete_artifact
    description: Delete an artifact after explicit user confirmation.
  exercise_list_workouts:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: list_workouts
    description: List workout templates and their exercises.
  exercise_save_workout:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: save_workout
    description: Create or update a workout template (upsert on id).
  exercise_delete_workout:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: delete_workout
    description: Delete a workout template after explicit user confirmation.
  exercise_list_routines:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: list_routines
    description: List weekly routines (weekday -> workout IDs).
  exercise_save_routine:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: save_routine
    description: Create or update a weekly routine (upsert on id).
  exercise_delete_routine:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: delete_routine
    description: Delete a routine after explicit user confirmation.
  exercise_list_equipment:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: list_equipment
    description: List equipment items.
  exercise_add_equipment:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: add_equipment
    description: Add a new equipment item (conflict if id exists).
  exercise_update_equipment:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: update_equipment
    description: Update an existing equipment item.
  exercise_delete_equipment:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: delete_equipment
    description: Delete an equipment item after explicit user confirmation.
  exercise_list_history:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: list_history
    description: List logged workout sessions (date, duration, volume, exercises).
  exercise_log_workout:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: log_workout
    description: Record a completed workout session into history.
  exercise_update_log:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: update_log
    description: Update a logged workout session.
  exercise_delete_log:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: delete_log
    description: Delete a logged workout session after explicit user confirmation.
  exercise_sync_strava:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: sync_strava
    description: Import Strava run/walk activities into history (additive, dedups). Requires Strava credentials.
  mailbox_list_accounts:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: list_accounts
    description: List configured mailbox accounts (id, provider, email, display name). No secrets.
  mailbox_list_folders:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: list_folders
    description: Folder tree for one account (tree, flat, count). Requires a configured account.
  mailbox_list_messages:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: list_messages
    description: Recent messages in a folder (default INBOX, limit 25), each with a uid.
  mailbox_organize_message:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: organize_message
    description: Move a message by uid from source to dest (reversible; creates dest if missing).
  mailbox_move_messages:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: move_messages
    description: Batch-move messages by uid from source to dest in one round trip (reversible).
  mailbox_mark_messages:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: mark_messages
    description: Mark messages read/unread and/or starred (tri-state; reversible).
  mailbox_delete_messages:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: delete_messages
    description: Delete messages by uid; soft (move to Trash, reversible) or permanent (confirm required).
  mailbox_create_folder:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: create_folder
    description: Create a folder/label for an account (idempotent).
  mailbox_send_message:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: send_message
    description: Send a message (irreversible). Returns permission_denied unless confirm is true.
  mailbox_reply_message:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: reply_message
    description: Reply/reply-all to a message by uid, threaded (irreversible; requires confirm true).
  projectmanager_list_projects:
    app: projectmanager
    module: utils.apps.projectmanager.agent.tools
    function: list_projects
    description: List all projects with category, status, progress, and deadline.
  projectmanager_list_goals_with_deadlines:
    app: projectmanager
    module: utils.apps.projectmanager.agent.tools
    function: list_goals_with_deadlines
    description: List all goals that have a deadline, sorted soonest first with deadline_status.
  projectmanager_create_project:
    app: projectmanager
    module: utils.apps.projectmanager.agent.tools
    function: create_project
    description: Create a new project with title, category_name, and optional color/description/deadline/status.
  projectmanager_create_goals:
    app: projectmanager
    module: utils.apps.projectmanager.agent.tools
    function: create_goals
    description: Add one or more goals (each with title and optional deadline) to an existing project.
  calendar_list_schedules:
    app: calendar
    module: utils.apps.calendar.agent.tools
    function: list_schedules
    description: List available weekly schedule filenames.
  calendar_get_day:
    app: calendar
    module: utils.apps.calendar.agent.tools
    function: get_day
    description: Get merged schedule + direct events for one date (YYYY-MM-DD).
  calendar_get_week:
    app: calendar
    module: utils.apps.calendar.agent.tools
    function: get_week
    description: Get merged events for a week (optional date; defaults to current week).
  calendar_get_range:
    app: calendar
    module: utils.apps.calendar.agent.tools
    function: get_range
    description: Get merged events across an inclusive start..end date range.
  calendar_find_free_slots:
    app: calendar
    module: utils.apps.calendar.agent.tools
    function: find_free_slots
    description: Find open time gaps on a date within a window (for suggesting meeting times).
  calendar_list_upcoming:
    app: calendar
    module: utils.apps.calendar.agent.tools
    function: list_upcoming
    description: List upcoming direct events within N days (optional type filter).
  calendar_add_direct_event:
    app: calendar
    module: utils.apps.calendar.agent.tools
    function: add_direct_event
    description: Add a one-off direct event (date, title, start, end, optional type/sub).
  calendar_update_direct_event:
    app: calendar
    module: utils.apps.calendar.agent.tools
    function: update_direct_event
    description: Update the direct event at a given index.
  calendar_delete_direct_event:
    app: calendar
    module: utils.apps.calendar.agent.tools
    function: delete_direct_event
    description: Delete the direct event at an index (irreversible; requires confirm true).
  calendar_delete_event_by_title:
    app: calendar
    module: utils.apps.calendar.agent.tools
    function: delete_event_by_title
    description: Delete a direct event by date + partial title (irreversible; requires confirm true).
  calendar_add_entry:
    app: calendar
    module: utils.apps.calendar.agent.tools
    function: add_entry
    description: Map a schedule to a date range (409 on overlap).
  calendar_delete_entry:
    app: calendar
    module: utils.apps.calendar.agent.tools
    function: delete_entry
    description: Remove the schedule-to-date mapping at an index (irreversible; requires confirm true).
  imdbspy_list_media:
    app: imdbspy
    module: utils.apps.imdbspy.agent.tools
    function: list_media
    description: List tracked movies/TV shows (filters status/kind/search; paginated).
  imdbspy_add_media:
    app: imdbspy
    module: utils.apps.imdbspy.agent.tools
    function: add_media
    description: Scrape and add titles by IMDb URL/ID (network); returns added + per-item errors.
  imdbspy_set_status:
    app: imdbspy
    module: utils.apps.imdbspy.agent.tools
    function: set_status
    description: Set a title's status (seen / not_seen / abandoned).
  imdbspy_update_review:
    app: imdbspy
    module: utils.apps.imdbspy.agent.tools
    function: update_review
    description: Set a weighted rating (fun/grit/comfort), review, and/or seasons seen.
  imdbspy_delete_media:
    app: imdbspy
    module: utils.apps.imdbspy.agent.tools
    function: delete_media
    description: Delete a tracked title (irreversible; requires confirm true).
  imdbspy_refresh_metadata:
    app: imdbspy
    module: utils.apps.imdbspy.agent.tools
    function: refresh_metadata
    description: Refresh rating/year/seasons/episodes for all titles (network; no image re-download).
  recipes_list_recipes:
    app: recipes
    module: utils.apps.recipes.agent.tools
    function: list_recipes
    description: List all recipes as summary cards (id, title, servings, cuisine, meal type, images).
  recipes_get_recipe:
    app: recipes
    module: utils.apps.recipes.agent.tools
    function: get_recipe
    description: Get full detail for one recipe_id (structured ingredients + ordered steps).
  recipes_find_by_ingredients:
    app: recipes
    module: utils.apps.recipes.agent.tools
    function: find_by_ingredients
    description: Rank recipes by pantry match from ingredient_names/ingredient_ids (optional meal_types/cuisine_regions).
  recipes_list_ingredients:
    app: recipes
    module: utils.apps.recipes.agent.tools
    function: list_ingredients
    description: List the pantry ingredient catalog (id, name, category).
  recipes_create_recipe:
    app: recipes
    module: utils.apps.recipes.agent.tools
    function: create_recipe
    description: Create a recipe from a structured object (title, ingredients, steps, optional meta).
  recipes_update_recipe:
    app: recipes
    module: utils.apps.recipes.agent.tools
    function: update_recipe
    description: Replace an existing recipe wholesale (recipe_id + recipe object).
  recipes_delete_recipe:
    app: recipes
    module: utils.apps.recipes.agent.tools
    function: delete_recipe
    description: Delete a recipe (irreversible; requires confirm true).
  timekeeper_list_logs:
    app: timekeeper
    module: utils.apps.timekeeper.agent.tools
    function: list_logs
    description: List tracked 5-minute intervals; pass date (YYYY-MM-DD) to scope to one day.
  timekeeper_daily_totals:
    app: timekeeper
    module: utils.apps.timekeeper.agent.tools
    function: daily_totals
    description: Total tracked minutes per day (oldest first).
  timekeeper_list_categories:
    app: timekeeper
    module: utils.apps.timekeeper.agent.tools
    function: list_categories
    description: The category/subcategory taxonomy with ids used when saving logs.
  timekeeper_save_day:
    app: timekeeper
    module: utils.apps.timekeeper.agent.tools
    function: save_day
    description: Replace a day's logs from painted 5-minute block indices (overwrites the day; requires confirm true).
  timekeeper_delete_log:
    app: timekeeper
    module: utils.apps.timekeeper.agent.tools
    function: delete_log
    description: Delete one log row by id (irreversible; requires confirm true).
