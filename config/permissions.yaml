filesystem:
  media_viewer_artifacts:
    description: Local artifact store read/write scope
    allow:
      - "{artifacts_root}/**"
    deny:
      - "../**"
      - "**/.env"
      - "config/**"

network:
  web_research:
    description: Outbound HTTP for SearXNG discovery and page text extraction
    allow_schemes:
      - http
      - https
  exercise_strava:
    description: Outbound HTTPS to the Strava API for activity import
    allow_schemes:
      - https
    allow_hosts:
      - www.strava.com
      - api.strava.com

artifacts_root: data/artifacts
