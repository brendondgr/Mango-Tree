[project]
name = "bdgrskills"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
    "django>=5.2",
    "djangorestframework>=3.16",
    "pillow>=11.2",
    "langgraph>=1.2.5",
    "requests>=2.34.2",
    "beautifulsoup4>=4.13.4",
    "opencv-python-headless>=4.13.0.92",
    "google-auth>=2.55.1",
    "msal>=1.37.0",
    "python-dotenv>=1.0",
    "stravalib>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["utils/tests"]
DJANGO_SETTINGS_MODULE = "config.django.settings"
