[project]
name = "mango-tree"
version = "0.1.0"
description = "A local-first agent workspace: eight self-hosted apps reachable both through a React UI and by a LangGraph agent whose access is gated in code."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pyyaml>=6.0.3",
    "django>=5.2",
    "djangorestframework>=3.16",
    "pillow>=11.2",
    "langgraph>=1.2.5",
    "requests>=2.34.2",
    "beautifulsoup4>=4.13.4",
    "opencv-python-headless>=4.13.0.92",
    "google-auth>=2.55.1",
    "msal>=1.37.0",
    "python-dotenv>=1.0",
    "stravalib>=2.5.0",
    "reportlab>=4.0",
    # LLM provider SDKs. The abstraction in utils/shared/llm/kit imports these
    # lazily, so a missing one raises a clear error instead of breaking start-up
    # — but the owner is meant to be able to choose any provider from the
    # settings UI without a terminal, so all four ship by default.
    "httpx>=0.27",          # Ollama native API, llama.cpp /props, health probes
    "openai>=1.60",         # OpenAI, vLLM, llama.cpp, LM Studio, DeepSeek, any /v1
    "anthropic>=0.40",      # Claude
    "google-genai>=1.0",    # Gemini (NOT google-generativeai, which is deprecated)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
]
# UI audit harness (utils/scripts/audit_ui.py, verify_mobile.py). Kept out of
# `dev` because it also needs a browser binary: `playwright install chromium`.
audit = [
    "playwright>=1.44,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["utils/tests"]
DJANGO_SETTINGS_MODULE = "config.django.settings"
