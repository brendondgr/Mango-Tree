tools:
  media_viewer_list_artifacts:
    app: media_viewer
    module: utils.apps.media_viewer.agent.tools
    function: list_artifacts
    description: List persisted artifacts, optionally filtered by kind.
  media_viewer_get_artifact:
    app: media_viewer
    module: utils.apps.media_viewer.agent.tools
    function: get_artifact
    description: Fetch artifact metadata by ID.
  media_viewer_save_artifact:
    app: media_viewer
    module: utils.apps.media_viewer.agent.tools
    function: save_artifact
    description: Save base64-encoded bytes as a local artifact.
  media_viewer_delete_artifact:
    app: media_viewer
    module: utils.apps.media_viewer.agent.tools
    function: delete_artifact
    description: Delete an artifact after explicit user confirmation.
  exercise_list_workouts:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: list_workouts
    description: List workout templates and their exercises.
  exercise_save_workout:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: save_workout
    description: Create or update a workout template (upsert on id).
  exercise_delete_workout:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: delete_workout
    description: Delete a workout template after explicit user confirmation.
  exercise_list_routines:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: list_routines
    description: List weekly routines (weekday -> workout IDs).
  exercise_save_routine:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: save_routine
    description: Create or update a weekly routine (upsert on id).
  exercise_delete_routine:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: delete_routine
    description: Delete a routine after explicit user confirmation.
  exercise_list_equipment:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: list_equipment
    description: List equipment items.
  exercise_add_equipment:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: add_equipment
    description: Add a new equipment item (conflict if id exists).
  exercise_update_equipment:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: update_equipment
    description: Update an existing equipment item.
  exercise_delete_equipment:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: delete_equipment
    description: Delete an equipment item after explicit user confirmation.
  exercise_list_history:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: list_history
    description: List logged workout sessions (date, duration, volume, exercises).
  exercise_log_workout:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: log_workout
    description: Record a completed workout session into history.
  exercise_update_log:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: update_log
    description: Update a logged workout session.
  exercise_delete_log:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: delete_log
    description: Delete a logged workout session after explicit user confirmation.
  exercise_sync_strava:
    app: exercise
    module: utils.apps.exercise.agent.tools
    function: sync_strava
    description: Import Strava run/walk activities into history (additive, dedups). Requires Strava credentials.
  mailbox_list_accounts:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: list_accounts
    description: List configured mailbox accounts (id, provider, email, display name). No secrets.
  mailbox_list_folders:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: list_folders
    description: Folder tree for one account (tree, flat, count). Requires a configured account.
  mailbox_list_messages:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: list_messages
    description: Recent messages in a folder (default INBOX, limit 25), each with a uid.
  mailbox_organize_message:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: organize_message
    description: Move a message by uid from source to dest (reversible; creates dest if missing).
  mailbox_create_folder:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: create_folder
    description: Create a folder/label for an account (idempotent).
  mailbox_send_message:
    app: mailbox
    module: utils.apps.mailbox.agent.tools
    function: send_message
    description: Send a message (irreversible). Returns permission_denied unless confirm is true.
